<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatRT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #e2e8f0;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* HEADER */
    header {
      background: #1e293b; border-bottom: 1px solid #334155;
      padding: 0.75rem 1rem; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #f8fafc; }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }
    .user-badge {
      background: #6366f1; color: #fff; padding: 0.25rem 0.75rem;
      border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    }
    button.logout {
      background: none; border: 1px solid #475569; color: #94a3b8;
      padding: 0.25rem 0.75rem; border-radius: 8px; cursor: pointer;
      font-size: 0.75rem; transition: all 0.2s;
    }
    button.logout:hover { border-color: #ef4444; color: #ef4444; }

    /* LAYOUT */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* SIDEBAR */
    .sidebar {
      width: 240px; background: #1e293b; border-right: 1px solid #334155;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-section { padding: 0.75rem; border-bottom: 1px solid #334155; }
    .sidebar-section h3 { font-size: 0.7rem; text-transform: uppercase;
      color: #64748b; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .new-room-form { display: flex; gap: 0.25rem; }
    .new-room-form input {
      flex: 1; padding: 0.4rem 0.5rem; background: #0f172a;
      border: 1px solid #334155; border-radius: 6px; color: #e2e8f0;
      font-size: 0.75rem; outline: none;
    }
    .new-room-form input:focus { border-color: #6366f1; }
    .new-room-form button {
      background: #6366f1; color: #fff; border: none; border-radius: 6px;
      padding: 0.4rem 0.6rem; cursor: pointer; font-size: 0.875rem;
    }
    .rooms-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .room-item {
      padding: 0.5rem 0.75rem; border-radius: 8px; cursor: pointer;
      font-size: 0.8rem; color: #94a3b8; transition: all 0.15s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .room-item:hover { background: #0f172a; color: #e2e8f0; }
    .room-item.active { background: #312e81; color: #a5b4fc; font-weight: 600; }
    .online-list { padding: 0.5rem; overflow-y: auto; max-height: 150px; }
    .online-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0.5rem; font-size: 0.75rem; color: #94a3b8;
      cursor: pointer; border-radius: 6px; transition: background 0.15s;
    }
    .online-item:hover { background: #0f172a; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header {
      padding: 0.75rem 1rem; background: #1e293b; border-bottom: 1px solid #334155;
      display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0;
    }
    .chat-header h2 { font-size: 0.95rem; font-weight: 600; }
    .chat-header .room-users { font-size: 0.75rem; color: #64748b; margin-left: auto; }
    .messages {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .msg {
      display: flex; flex-direction: column; max-width: 75%;
      animation: fadeIn 0.2s ease;
    }
    .msg.own { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    .msg-meta { font-size: 0.7rem; color: #64748b; margin-bottom: 0.2rem; }
    .msg-bubble {
      padding: 0.5rem 0.75rem; border-radius: 12px;
      font-size: 0.85rem; line-height: 1.4; word-break: break-word;
      position: relative;
    }
    .msg.own .msg-bubble { background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
    .msg.other .msg-bubble { background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 4px; }
    .msg-actions {
      display: none; gap: 0.25rem; margin-top: 0.25rem;
    }
    .msg:hover .msg-actions { display: flex; }
    .msg-actions button {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      border-radius: 6px; padding: 0.15rem 0.4rem; font-size: 0.7rem; cursor: pointer;
    }
    .msg-actions button:hover { border-color: #6366f1; color: #a5b4fc; }
    .reactions-bar { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .reaction-badge {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 999px; padding: 0.1rem 0.4rem;
      font-size: 0.75rem; cursor: pointer; transition: border-color 0.15s;
    }
    .reaction-badge:hover { border-color: #6366f1; }
    .reaction-badge.mine { border-color: #6366f1; background: #1e1b4b; }
    .typing-indicator {
      font-size: 0.75rem; color: #64748b; padding: 0.25rem 1rem;
      min-height: 1.5rem; flex-shrink: 0;
    }

    /* INPUT BAR */
    .input-bar {
      padding: 0.75rem 1rem; background: #1e293b;
      border-top: 1px solid #334155; display: flex; gap: 0.5rem; flex-shrink: 0;
    }
    .input-bar input {
      flex: 1; padding: 0.625rem 0.875rem; background: #0f172a;
      border: 1px solid #334155; border-radius: 999px; color: #e2e8f0;
      font-size: 0.875rem; outline: none; transition: border-color 0.2s;
    }
    .input-bar input:focus { border-color: #6366f1; }
    .input-bar button {
      background: #6366f1; color: #fff; border: none; border-radius: 999px;
      padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .input-bar button:hover { background: #4f46e5; }
    .emoji-btn {
      background: none; border: none; font-size: 1.25rem; cursor: pointer;
      padding: 0.25rem; border-radius: 8px;
    }
    .emoji-btn:hover { background: #334155; }

    /* EMPTY STATE */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #475569; gap: 0.5rem;
    }
    .empty .icon { font-size: 3rem; }

    /* PRIVATE MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 1.5rem; width: 360px;
    }
    .modal h3 { margin-bottom: 1rem; font-size: 1rem; }
    .modal input {
      width: 100%; padding: 0.625rem; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px; color: #e2e8f0;
      font-size: 0.875rem; outline: none; margin-bottom: 0.75rem;
    }
    .modal input:focus { border-color: #6366f1; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .modal-actions button {
      padding: 0.5rem 1rem; border-radius: 8px; border: none;
      cursor: pointer; font-size: 0.875rem;
    }
    .btn-cancel { background: #334155; color: #e2e8f0; }
    .btn-send { background: #6366f1; color: #fff; font-weight: 600; }

    /* EMOJI PICKER */
    .emoji-picker {
      position: absolute; bottom: 70px; left: 1rem;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; padding: 0.75rem; display: none;
      gap: 0.4rem; flex-wrap: wrap; max-width: 220px; z-index: 50;
    }
    .emoji-picker.open { display: flex; }
    .emoji-picker span { font-size: 1.4rem; cursor: pointer; border-radius: 6px; padding: 0.2rem; }
    .emoji-picker span:hover { background: #334155; }

    /* PRIVATE MESSAGES PANEL */
    .pm-toast {
      position: fixed; bottom: 1rem; right: 1rem;
      background: #1e293b; border: 1px solid #6366f1;
      border-radius: 12px; padding: 0.75rem 1rem;
      max-width: 280px; z-index: 200; animation: fadeIn 0.3s ease;
    }
    .pm-toast .pm-from { font-size: 0.7rem; color: #a5b4fc; margin-bottom: 0.25rem; }
    .pm-toast .pm-content { font-size: 0.85rem; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
  </style>
</head>
<body>

<header>
  <h1>💬 ChatRT</h1>
  <div class="header-right">
    <span class="user-badge" id="userBadge">...</span>
    <button class="logout" onclick="logout()">Salir</button>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>Salas</h3>
      <div class="new-room-form">
        <input id="newRoomName" placeholder="Nueva sala..." maxlength="30" />
        <button onclick="createRoom()">+</button>
      </div>
    </div>
    <div class="rooms-list" id="roomsList"></div>

    <div class="sidebar-section" style="margin-top:auto">
      <h3>Online (<span id="onlineCount">0</span>)</h3>
    </div>
    <div class="online-list" id="onlineList"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <!-- Empty state -->
    <div class="empty" id="emptyState">
      <div class="icon">💬</div>
      <span>Selecciona o crea una sala para empezar</span>
    </div>

    <!-- Chat activo -->
    <div id="chatArea" style="display:none; flex:1; flex-direction:column; overflow:hidden; display:none">
      <div class="chat-header">
        <h2 id="roomTitle">#sala</h2>
        <span class="room-users" id="roomUsersCount"></span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typingIndicator"></div>
      <div style="position:relative">
        <div class="emoji-picker" id="emojiPicker">
          <span>😀</span><span>😂</span><span>❤️</span><span>👍</span>
          <span>🔥</span><span>🎉</span><span>😮</span><span>😢</span>
          <span>👏</span><span>🚀</span><span>💯</span><span>🤔</span>
        </div>
        <div class="input-bar">
          <button class="emoji-btn" onclick="toggleEmojiPicker()" title="Emoji">😊</button>
          <input id="msgInput" placeholder="Escribe un mensaje..." autocomplete="off"
            onkeydown="handleKey(event)" oninput="sendTyping()" />
          <button onclick="sendMessage()">Enviar</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Private Message Modal -->
<div class="modal-overlay" id="pmModal">
  <div class="modal">
    <h3>✉️ Mensaje privado a <span id="pmRecipientName"></span></h3>
    <input id="pmContent" placeholder="Escribe tu mensaje..." onkeydown="if(event.key==='Enter') sendPrivate()" />
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePmModal()">Cancelar</button>
      <button class="btn-send" onclick="sendPrivate()">Enviar</button>
    </div>
  </div>
</div>

<script src="/socket.io-client/socket.io.min.js"></script>
<script>
  // ── Auth ──────────────────────────────────────────
  const token = localStorage.getItem('token');
  const me = JSON.parse(localStorage.getItem('user') || 'null');
  if (!token || !me) window.location.href = '/';

  document.getElementById('userBadge').textContent = me.name;

  function logout() {
    localStorage.clear();
    window.location.href = '/';
  }

  // ── State ─────────────────────────────────────────
  let currentRoom = null;
  let rooms = [];
  let onlineUsers = {};      // userId → { name }
  let roomUserCount = 0;
  let typingTimer = null;
  let pmRecipientId = null;

  // ── Socket ────────────────────────────────────────
  const socket = io({ auth: { token } });

  socket.on('connect_error', (err) => {
    alert('Error de conexión: ' + err.message);
    logout();
  });

  // Presencia
  socket.on('user:online', ({ userId, name }) => {
    if (userId === me.id) return;
    onlineUsers[userId] = { name };
    renderOnlineUsers();
    showDesktopNotification(`${name} se ha conectado`);
  });

  socket.on('user:offline', ({ userId, name }) => {
    delete onlineUsers[userId];
    renderOnlineUsers();
  });

  // Sala — nuevo usuario
  socket.on('room:user-joined', ({ user }) => {
    roomUserCount++;
    updateRoomUsersCount();
    appendSystemMsg(`${user.name} se unió a la sala`);
    showDesktopNotification(`${user.name} entró en #${currentRoom?.name}`);
  });

  socket.on('room:user-left', ({ user }) => {
    roomUserCount = Math.max(0, roomUserCount - 1);
    updateRoomUsersCount();
    appendSystemMsg(`${user.name} salió de la sala`);
  });

  // Mensajes
  socket.on('chat:message', (msg) => {
    appendMessage(msg);
    if (msg.user.id !== me.id) {
      showDesktopNotification(`${msg.user.name}: ${msg.content}`, `#${currentRoom?.name}`);
    }
  });

  // Typing
  let typingUsers = {};
  socket.on('chat:typing', ({ user }) => {
    typingUsers[user.id] = user.name;
    renderTyping();
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      delete typingUsers[user.id];
      renderTyping();
    }, 2000);
  });

  // Mensaje privado recibido
  socket.on('chat:private', ({ from, content }) => {
    showPmToast(from.name, content, from.id);
    showDesktopNotification(`💌 ${from.name}: ${content}`, 'Mensaje privado');
  });

  // Reacciones en tiempo real
  socket.on('chat:reaction', ({ messageId, reactions }) => {
    updateReactions(messageId, reactions);
  });

  // ── Rooms REST ────────────────────────────────────
  async function loadRooms() {
    const res = await fetch('/api/rooms');
    const json = await res.json();
    rooms = json.data || [];
    renderRooms();
  }

  async function createRoom() {
    const name = document.getElementById('newRoomName').value.trim();
    if (!name) return;
    const res = await fetch('/api/rooms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ name })
    });
    const json = await res.json();
    if (!res.ok) return alert(json.message);
    document.getElementById('newRoomName').value = '';
    rooms.unshift(json.data);
    renderRooms();
    joinRoom(json.data);
  }

  function renderRooms() {
    const el = document.getElementById('roomsList');
    el.innerHTML = rooms.map(r => `
      <div class="room-item ${currentRoom?._id === r._id ? 'active' : ''}"
           onclick="joinRoom(${JSON.stringify(r).replace(/"/g, '&quot;')})">
        # ${r.name}
      </div>
    `).join('');
  }

  // ── Socket — Sala ─────────────────────────────────
  function joinRoom(room) {
    if (currentRoom?._id === room._id) return;

    // Salir de sala anterior
    if (currentRoom) socket.emit('room:leave', { roomId: currentRoom._id });

    currentRoom = room;
    renderRooms();

    socket.emit('room:join', { roomId: room._id }, ({ error, message, users, history }) => {
      if (error) return alert(message);

      document.getElementById('emptyState').style.display = 'none';
      const chatArea = document.getElementById('chatArea');
      chatArea.style.display = 'flex';
      chatArea.style.flexDirection = 'column';
      document.getElementById('roomTitle').textContent = `# ${room.name}`;

      roomUserCount = users?.length || 1;
      updateRoomUsersCount();

      // Renderizar historial
      const msgs = document.getElementById('messages');
      msgs.innerHTML = '';
      (history || []).forEach(msg => appendMessage({
        id: msg._id,
        user: { id: msg.user._id, name: msg.user.name },
        content: msg.content,
        reactions: msg.reactions || [],
        timestamp: msg.createdAt
      }));
      scrollToBottom();
    });
  }

  // ── Mensajes ──────────────────────────────────────
  function sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !currentRoom) return;
    socket.emit('chat:message', { roomId: currentRoom._id, content });
    input.value = '';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  let lastTypingEmit = 0;
  function sendTyping() {
    if (!currentRoom) return;
    const now = Date.now();
    if (now - lastTypingEmit > 1000) {
      socket.emit('chat:typing', { roomId: currentRoom._id });
      lastTypingEmit = now;
    }
  }

  function appendMessage(msg) {
    const isOwn = msg.user.id === me.id || msg.user.id?.toString() === me.id;
    const time = new Date(msg.timestamp).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = `msg ${isOwn ? 'own' : 'other'}`;
    div.dataset.msgId = msg.id || msg._id;

    const reactions = renderReactionBadges(msg.reactions || [], msg.id || msg._id);

    div.innerHTML = `
      <div class="msg-meta">${isOwn ? '' : msg.user.name + ' · '}${time}</div>
      <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      <div class="reactions-bar" id="reactions-${msg.id || msg._id}">${reactions}</div>
      <div class="msg-actions">
        <button onclick="openReactionPicker('${msg.id || msg._id}')">😊</button>
        ${isOwn ? `<button onclick="deleteMessage('${msg.id || msg._id}')">🗑</button>` : ''}
        <button onclick="openPmModal('${msg.user.id}', '${escapeHtml(msg.user.name)}')">✉️</button>
      </div>
    `;
    document.getElementById('messages').appendChild(div);
    scrollToBottom();
  }

  function appendSystemMsg(text) {
    const div = document.createElement('div');
    div.style.cssText = 'text-align:center;font-size:0.7rem;color:#475569;padding:0.25rem';
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    scrollToBottom();
  }

  function scrollToBottom() {
    const el = document.getElementById('messages');
    el.scrollTop = el.scrollHeight;
  }

  // ── Reacciones ────────────────────────────────────
  function renderReactionBadges(reactions, msgId) {
    const counts = {};
    reactions.forEach(r => {
      if (!counts[r.emoji]) counts[r.emoji] = { count: 0, mine: false };
      counts[r.emoji].count++;
      if (r.user === me.id || r.user?.toString() === me.id) counts[r.emoji].mine = true;
    });
    return Object.entries(counts).map(([emoji, { count, mine }]) =>
      `<span class="reaction-badge ${mine ? 'mine' : ''}"
             onclick="toggleReaction('${msgId}', '${emoji}')">${emoji} ${count}</span>`
    ).join('');
  }

  function updateReactions(messageId, reactions) {
    const el = document.getElementById(`reactions-${messageId}`);
    if (el) el.innerHTML = renderReactionBadges(reactions, messageId);
  }

  function openReactionPicker(msgId) {
    const picker = document.getElementById('emojiPicker');
    picker.classList.toggle('open');
    picker.dataset.targetMsg = msgId;
  }

  function toggleEmojiPicker() {
    const picker = document.getElementById('emojiPicker');
    picker.dataset.targetMsg = '';
    picker.classList.toggle('open');
  }

  document.getElementById('emojiPicker').addEventListener('click', (e) => {
    if (e.target.tagName !== 'SPAN') return;
    const emoji = e.target.textContent;
    const msgId = e.target.closest('.emoji-picker').dataset.targetMsg;
    if (msgId) {
      toggleReaction(msgId, emoji);
    } else {
      document.getElementById('msgInput').value += emoji;
      document.getElementById('msgInput').focus();
    }
    e.target.closest('.emoji-picker').classList.remove('open');
  });

  function toggleReaction(messageId, emoji) {
    if (!currentRoom) return;
    socket.emit('chat:reaction', { roomId: currentRoom._id, messageId, emoji });
  }

  // ── Borrar mensaje ────────────────────────────────
  async function deleteMessage(msgId) {
    if (!currentRoom || !confirm('¿Eliminar este mensaje?')) return;
    const res = await fetch(`/api/rooms/${currentRoom._id}/messages/${msgId}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.ok) {
      document.querySelector(`[data-msg-id="${msgId}"]`)?.remove();
    }
  }

  // ── Mensajes privados ─────────────────────────────
  function openPmModal(userId, userName) {
    if (userId === me.id) return;
    pmRecipientId = userId;
    document.getElementById('pmRecipientName').textContent = userName;
    document.getElementById('pmContent').value = '';
    document.getElementById('pmModal').classList.add('open');
    setTimeout(() => document.getElementById('pmContent').focus(), 100);
  }

  function closePmModal() {
    document.getElementById('pmModal').classList.remove('open');
    pmRecipientId = null;
  }

  function sendPrivate() {
    const content = document.getElementById('pmContent').value.trim();
    if (!content || !pmRecipientId) return;
    socket.emit('chat:private', { toUserId: pmRecipientId, content }, ({ error, delivered }) => {
      if (error) return alert('Error al enviar mensaje privado');
      if (!delivered) alert('El usuario no está conectado en este momento');
    });
    closePmModal();
  }

  function showPmToast(fromName, content, fromId) {
    const toast = document.createElement('div');
    toast.className = 'pm-toast';
    toast.innerHTML = `
      <div class="pm-from">💌 Mensaje privado de ${escapeHtml(fromName)}</div>
      <div class="pm-content">${escapeHtml(content)}</div>
    `;
    toast.onclick = () => openPmModal(fromId, fromName);
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 5000);
  }

  // ── Online users ──────────────────────────────────
  function renderOnlineUsers() {
    const list = document.getElementById('onlineList');
    const count = document.getElementById('onlineCount');
    const users = Object.entries(onlineUsers).filter(([id]) => id !== me.id);
    count.textContent = users.length;
    list.innerHTML = users.map(([id, { name }]) => `
      <div class="online-item" onclick="openPmModal('${id}', '${escapeHtml(name)}')">
        <span class="online-dot"></span>${escapeHtml(name)}
      </div>
    `).join('') || '<div style="padding:0.5rem;font-size:0.75rem;color:#475569">Nadie más online</div>';
  }

  function updateRoomUsersCount() {
    document.getElementById('roomUsersCount').textContent =
      `${roomUserCount} usuario${roomUserCount !== 1 ? 's' : ''}`;
  }

  // ── Typing indicator ──────────────────────────────
  function renderTyping() {
    const names = Object.values(typingUsers).filter(n => n !== me.name);
    const el = document.getElementById('typingIndicator');
    el.textContent = names.length
      ? `${names.join(', ')} está${names.length > 1 ? 'n' : ''} escribiendo...`
      : '';
  }

  // ── Desktop notifications (bonus) ─────────────────
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  function showDesktopNotification(body, title = 'ChatRT') {
    if (document.hasFocus()) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    new Notification(title, { body, icon: '/favicon.ico' });
  }

  // ── Utils ─────────────────────────────────────────
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Init ──────────────────────────────────────────
  loadRooms();
  renderOnlineUsers();

  // Cerrar emoji picker al hacer click fuera
  document.addEventListener('click', (e) => {
    const picker = document.getElementById('emojiPicker');
    if (!picker.contains(e.target) && !e.target.classList.contains('emoji-btn')) {
      picker.classList.remove('open');
    }
  });
</script>
</body>
</html>
