<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatRT — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; color: #f8fafc; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.5rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab {
      flex: 1; padding: 0.5rem; border: none; border-radius: 8px;
      background: #0f172a; color: #94a3b8; cursor: pointer; font-size: 0.875rem;
      transition: all 0.2s;
    }
    .tab.active { background: #6366f1; color: #fff; font-weight: 600; }
    .form { display: flex; flex-direction: column; gap: 0.75rem; }
    label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; display: block; }
    input {
      width: 100%; padding: 0.625rem 0.75rem; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px; color: #e2e8f0;
      font-size: 0.875rem; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #6366f1; }
    button[type="submit"] {
      width: 100%; padding: 0.75rem; background: #6366f1; color: #fff;
      border: none; border-radius: 8px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; margin-top: 0.5rem; transition: background 0.2s;
    }
    button[type="submit"]:hover { background: #4f46e5; }
    .error {
      background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5;
      padding: 0.625rem 0.75rem; border-radius: 8px; font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💬 ChatRT</h1>
    <p class="subtitle">Chat en tiempo real con Socket.IO</p>

    <div class="tabs">
      <button class="tab active" onclick="showTab('login')">Iniciar sesión</button>
      <button class="tab" onclick="showTab('register')">Registrarse</button>
    </div>

    <div id="error" class="error"></div>

    <!-- Login -->
    <form id="loginForm" class="form" onsubmit="handleLogin(event)">
      <div>
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="tu@email.com" required />
      </div>
      <div>
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>
      <button type="submit">Entrar</button>
    </form>

    <!-- Register -->
    <form id="registerForm" class="form" style="display:none" onsubmit="handleRegister(event)">
      <div>
        <label>Nombre</label>
        <input type="text" id="regName" placeholder="Tu nombre" required />
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="tu@email.com" required />
      </div>
      <div>
        <label>Contraseña</label>
        <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres" required minlength="8" />
      </div>
      <button type="submit">Crear cuenta</button>
    </form>
  </div>

  <script>
    // Si ya hay sesión, redirigir al chat
    if (localStorage.getItem('token')) window.location.href = '/chat.html';

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) =>
        t.classList.toggle('active', (i === 0) === (tab === 'login'))
      );
      document.getElementById('loginForm').style.display = tab === 'login' ? 'flex' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'flex' : 'none';
      hideError();
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() { document.getElementById('error').style.display = 'none'; }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const json = await res.json();
      if (!res.ok) return showError(json.message || 'Error al iniciar sesión');
      localStorage.setItem('token', json.data.token);
      localStorage.setItem('user', JSON.stringify(json.data.user));
      window.location.href = '/chat.html';
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideError();
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value
        })
      });
      const json = await res.json();
      if (!res.ok) return showError(json.message || 'Error al registrarse');
      localStorage.setItem('token', json.data.token);
      localStorage.setItem('user', JSON.stringify(json.data.user));
      window.location.href = '/chat.html';
    }
  </script>
</body>
</html>
