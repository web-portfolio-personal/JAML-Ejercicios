name: T11 — CI Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'T11/**'
      - '.github/workflows/t11-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'T11/**'

jobs:
  test:
    name: Run T11 tests
    runs-on: ubuntu-latest

    # Variables disponibles en TODOS los pasos del job
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/library_test
      JWT_SECRET: test-secret-32-characters-long-ok
      JWT_EXPIRES_IN: 2h

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: T11

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: T11/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Aplicar esquema de BD
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Ejecutar tests
        run: npm run test:ci
