name: T11 — Deploy → Railway

on:
  push:
    branches: [main]
    paths:
      - 'T11/**'
      - '.github/workflows/t11-deploy.yml'

# Railway (con "Wait for CI" activado) despliega automáticamente
# cuando este workflow termina en verde. No se necesita action adicional.

jobs:
  test:
    name: Run tests (CI gate para Railway)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/library_test
      JWT_SECRET: test-secret-32-characters-long-ok
      JWT_EXPIRES_IN: 2h

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: T11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: T11/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Aplicar esquema
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Tests
        run: npm run test:ci
