# NOTA: Este archivo es referencia. Los workflows activos están en la raíz
# del repo (.github/workflows/t11-ci.yml y t11-deploy.yml).
# GitHub Actions solo lee .github/workflows/ desde la raíz del repositorio.
#
# Para proyectos independientes (repo propio de T11), este sería el ci.yml activo:

name: CI — Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/library_test

      - name: Aplicar esquema de BD
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/library_test

      - name: Ejecutar tests
        run: npm run test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/library_test
          JWT_SECRET: test-secret-32-characters-long-ok
          JWT_EXPIRES_IN: 2h
